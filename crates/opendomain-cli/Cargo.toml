[package]
name = "opendomain-cli"
version = "0.20.26"
edition = "2021"
description = "The `opendomain` command-line interface for OpenDomain"
license = "MIT"

[[bin]]
name = "opendomain"
path = "src/main.rs"

[dependencies]
opendomain-core = { path = "../opendomain-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owo-colors = "4"
