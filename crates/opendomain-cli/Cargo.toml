[package]
name = "opendomain-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The `opendomain` command-line interface for OpenDomain"
readme = "../../readme.md"
documentation = "https://docs.rs/opendomain-cli"
keywords.workspace = true
categories = ["command-line-utilities"]

[[bin]]
name = "opendomain"
path = "src/main.rs"

# cible lib minimale : docs.rs construit `--lib` ; le moteur reste dans opendomain-core
[lib]
path = "src/lib.rs"

[dependencies]
opendomain-core = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owo-colors = "4"
