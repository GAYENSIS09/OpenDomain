<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" role="img" aria-label="OpenDomain">
  <title>OpenDomain — spirale épistémique traversée par un axe diagonal à 45°</title>
  <defs>
    <!-- Fond original conservé -->
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="45%" stop-color="#F1ECE1"/>
      <stop offset="100%" stop-color="#D9CFBA"/>
    </radialGradient>

    <!-- Spirale -->
    <linearGradient id="spiralGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"  stop-color="#0F0E0C" stop-opacity="1"/>
      <stop offset="35%" stop-color="#1B1A17" stop-opacity="0.82"/>
      <stop offset="70%" stop-color="#3D3A34" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1B1A17" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Rouge structurel -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#D9432B" stop-opacity="0"/>
      <stop offset="25%" stop-color="#D9432B" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#E85D3A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D9432B" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Axe diagonal -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1B1A17" stop-opacity="0"/>
      <stop offset="15%" stop-color="#1B1A17" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#1B1A17" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#1B1A17" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1B1A17" stop-opacity="0"/>
    </linearGradient>

    <!-- Halos -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#D9432B" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#D9432B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#D9432B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#F06A42" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#D9432B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D9432B" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtres -->
    <filter id="tightGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="400" height="440" fill="url(#bg)" filter="url(#grain)"/>

  <!-- Halo -->
  <circle cx="200" cy="195" r="135" fill="url(#halo)"/>

  <!-- === SPIRALE === -->
  <path d="M200 195
           m 0 -10
           a 10 10 0 1 1 -10 10
           a 20 20 0 1 0 20 -20
           a 32 32 0 1 1 -32 32
           a 46 46 0 1 0 46 -46
           a 62 62 0 1 1 -62 62
           a 80 80 0 1 0 80 -80
           a 100 100 0 1 1 -100 100
           a 122 122 0 1 0 122 -122
           a 146 146 0 1 1 -146 146
           a 172 172 0 1 0 172 -172"
        stroke="#0F0E0C" stroke-width="10" fill="none" stroke-linecap="round"
        opacity="0.06" transform="translate(3,4)" filter="url(#shadow)"/>

  <path d="M200 195
           m 0 -10
           a 10 10 0 1 1 -10 10
           a 20 20 0 1 0 20 -20
           a 32 32 0 1 1 -32 32
           a 46 46 0 1 0 46 -46
           a 62 62 0 1 1 -62 62
           a 80 80 0 1 0 80 -80
           a 100 100 0 1 1 -100 100
           a 122 122 0 1 0 122 -122
           a 146 146 0 1 1 -146 146
           a 172 172 0 1 0 172 -172"
        stroke="url(#spiralGrad)" stroke-width="9" fill="none" stroke-linecap="round"/>

  <path d="M200 195
           m 0 -10
           a 10 10 0 1 1 -10 10
           a 20 20 0 1 0 20 -20
           a 32 32 0 1 1 -32 32
           a 46 46 0 1 0 46 -46
           a 62 62 0 1 1 -62 62
           a 80 80 0 1 0 80 -80
           a 100 100 0 1 1 -100 100
           a 122 122 0 1 0 122 -122
           a 146 146 0 1 1 -146 146
           a 172 172 0 1 0 172 -172"
        stroke="#1B1A17" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.18"/>

  <!-- Portion rouge structurelle -->
  <path d="M200 195
           m 0 -10
           a 10 10 0 1 1 -10 10
           a 20 20 0 1 0 20 -20
           a 32 32 0 1 1 -32 32
           a 46 46 0 1 0 46 -46
           a 62 62 0 1 1 -62 62"
        stroke="url(#redGrad)" stroke-width="9" fill="none" stroke-linecap="round"
        filter="url(#tightGlow)" opacity="0.95"/>

  <!-- Trace rouge terminale -->
  <path d="M200 195
           m 0 -10
           a 10 10 0 1 1 -10 10
           a 20 20 0 1 0 20 -20
           a 32 32 0 1 1 -32 32
           a 46 46 0 1 0 46 -46
           a 62 62 0 1 1 -62 62
           a 80 80 0 1 0 80 -80
           a 100 100 0 1 1 -100 100
           a 122 122 0 1 0 122 -122
           a 146 146 0 1 1 -146 146
           a 172 172 0 1 0 172 -172"
        stroke="#D9432B" stroke-width="2" fill="none" stroke-linecap="round"
        opacity="0.35" stroke-dasharray="24 320"/>

  <!-- === AXE DIAGONAL À 45° (raccourci pour s'arrêter au nœud) === -->
  <!-- Ombre portée -->
  <line x1="105" y1="100" x2="280" y2="275"
        stroke="#0F0E0C" stroke-width="2" stroke-linecap="round" opacity="0.06" filter="url(#shadow)"/>

  <!-- Axe principal : s'arrête à (280, 275) au lieu de (298, 293) -->
  <line x1="102" y1="97" x2="280" y2="275"
        stroke="url(#beamGrad)" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Reflet lumineux -->
  <line x1="130" y1="125" x2="255" y2="250"
        stroke="#FBF8F1" stroke-width="0.5" stroke-linecap="round" opacity="0.35"/>

  <!-- === NŒUD SUPÉRIEUR (haut-gauche, sur l'axe) === -->
  <circle cx="102" cy="97" r="6.5" fill="#F1ECE1" stroke="#1B1A17" stroke-width="1.8"/>
  <circle cx="102" cy="97" r="2.2" fill="#1B1A17"/>
  <circle cx="100.6" cy="95.6" r="0.8" fill="#FBF8F1" opacity="0.7"/>

  <!-- === CENTRE ◎ (pivot, sur l'axe) === -->
  <circle cx="200" cy="195" r="22" fill="url(#coreGlow)"/>
  <circle cx="200" cy="195" r="13" fill="none" stroke="#D9432B" stroke-width="0.7" opacity="0.4"/>
  <circle cx="200" cy="195" r="7"  fill="none" stroke="#1B1A17" stroke-width="1.2" opacity="0.55"/>
  <circle cx="200" cy="195" r="4"  fill="#D9432B"/>
  <circle cx="198.4" cy="193.4" r="1.4" fill="#FBF8F1" opacity="0.75"/>

  <!-- === NŒUD INFÉRIEUR INCLINÉ (posé à l'extrémité de l'axe) === -->
  <g transform="translate(280 275) rotate(45)">
    <rect x="-7" y="-7" width="14" height="14" rx="2.5" fill="#1B1A17"/>
    <rect x="-3.5" y="-3.5" width="7" height="7" rx="1.2" fill="none"
          stroke="#FBF8F1" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Accents discrets -->
  <circle cx="295" cy="195" r="1.3" fill="#1B1A17" opacity="0.18"/>
  <circle cx="105" cy="195" r="1.3" fill="#1B1A17" opacity="0.18"/>
  <circle cx="250" cy="140" r="1.1" fill="#D9432B" opacity="0.3"/>
  <circle cx="150" cy="250" r="1.1" fill="#D9432B" opacity="0.3"/>
</svg>