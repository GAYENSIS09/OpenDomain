[workspace]
resolver = "2"
members = [
    "crates/opendomain-core",
    "crates/opendomain-cli",
]

[workspace.package]
version = "0.20.27"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/GAYENSIS09/OpenDomain"
homepage = "https://gayensis09.github.io/OpenDomain/"
description = "Domain-first, evidence-driven engineering"
keywords = ["domain", "traceability", "quality-gates", "requirements"]
categories = ["development-tools"]

[workspace.dependencies]
opendomain-core = { path = "crates/opendomain-core", version = "0.20.27" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
owo-colors = "4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
